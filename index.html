				<section data-markdown >
					<textarea data-template>
						## Land: A call option<span class="subtitle"><br></span>
						* An option is the right without obligation to obtain something of value upon the payment or giving up of something else of value.
						* Core concepts/terms
							- Asset obtained by exercise of option is the <strong>underlying asset</strong>.
							- That what is given up is the <strong>exercise price</strong>.
							- American options can be exercised <strong>any time</strong>, European options only at predefined expiration date.
							- <strong>Financial options</strong> are based on financial assets, often traded on exchanges.
							- <strong>Real option</strong> in property offer the right but not obligation to e. g. change the physical attributes of a property: (re-)develop, extend, change floorplan, change of use, ...

					</textarea>
				</section>



				<section data-markdown >
					<textarea data-template>
						## Numerical Example<span class="subtitle"><br>Option Value: Land valuation & development timing decision</span>
						* (Example nicked from <a href="https://www.routledge.com/Commercial-Real-Estate-Analysis-for-Investment-Finance-and-Development/Geltner-Miller-VanDeMinne-Eichholtz-Lindenthal-Shen/p/book/9781041076391">Geltner et al.</a>)
						* XYZ Development owns a tract of land that could be developed into a property worth `$`100m today
						* Current construction costs for this property are `$`88.24m
							- Construction costs are estimated to rise by 2% annually
							- The appropriate discount rate for XYZ’s typical projects is 20% annually
						* Adding uncertainty
							- If XYZ postpones the development, markets can either develop favourably in the coming year (new sales price `$`113.21m) or take a dip (new price `$`78.62)
							- Chances for the positive scenario are 70%, and 30% for the negative case

					</textarea>
				</section>


				<section data-markdown >
					<textarea data-template>
						## Cashflows, Prob., & NPV <span class="subtitle"><br>Land valuation and the development timing decision.</span>
						<img src="imgs/XYZ1.png" height="500">
					</textarea>
				</section>


				<section data-markdown >
					<textarea data-template>
						## Arbitrage perspective<span class="subtitle"><br>What is a fair value for the cashflows from the option?</span>
						* Replicating the option’s outcomes with a combination of financial assets.
							- If we can price the replicaton portfolio, then we can price the option: Same price for identical cashflows!
						* Assumption: complete and frictionless markets
							- XYZ can buy or sell (including short sales) land, built properties and risk-free bonds
							- No trading costs
							- Any fraction or quantity possible (e. g. ⅔ of a building)
						* In this example, it is possible to observe the total returns expected by investors
							- For risk-free bonds: 3%
							- For developed property: 9%

					</textarea>
				</section>


				<section data-markdown >
					<textarea data-template>
						## The replicating portfolio<span class="subtitle"><br>Debt and developed property: How to find portfolio weights?</span>
						* Not difficult in binomial word: Two unknown quantities to determine
							- The share of future building to purchase: N
							- The amount to borrow: B
						* With...
							- P representing the replicating portfolio; r<sub>f</sub> is the risk-free rate at which one can borrow; V is the value of the newly built building; $C_1^{up}$, $C_1^{down}$ = cash flows at each scenario in year 1.
						* Cash flows are given by linear equations...
							- (1) $P_1^{up} = N \times V_1^{up} - (1+r_f) B = C_1^{up} $ and
							- (2) $P_1^{down} = N \times V_1^{down} - (1+r_f) B = C_1^{down}$,
						* which can be rearranged to...
							- (3) $N = \frac{C_1^{up}-C_1^{down}}{V_1^{up}-V_1^{down}}$ and
							- (4) $    B = \frac{N \times V_1^{down} -C_1^{down} } {1+r_f}$.

					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Back to our example...<span class="subtitle"><br>We know $C_1^{up},C_1^{down}, V_1^{up}, V_1^{down}, r_f$  and can solve for N and B</span>
						* Parameter values
							- V<sub>down</sub>:         `$`78.62
							- V<sub>up</sub>:         `$`113.21
							- C<sub>down</sub>:     0
							- C<sub>up</sub>:         `$`23.21
							- r<sub>f</sub>:         0.03
						* Plug everything into (3) and (4)
							- $N = \frac{C_1^{up}-C_1^{down}}{V_1^{up}-V_1^{down}} = \frac{\\$23.21-0}{\\$113.21-\\$78.62} = 0.67$
 							- $  B = \frac{N \times V_1^{down} -C_1^{down} } {1+r_f} = (N \times \\$78.62 -0 )/(1+0.03) = \\$51.22$
					</textarea>
				</section>


				<section data-markdown >
					<textarea data-template>
						## Arbitrage perspective <span class="subtitle"><br>Create portfolio that produces exactly same cashflows <br>&mdash; and for which we know the fair price.</span>
						* Assume, XYZ can purchase 67% <sup>(*)</sup> of the building in one year time from now
							- Present value:   $0.67 \frac{0.7 \times \\$113.21 + 0.3\times \\$78.62}{1.09}  = 0.67  \frac{\\$102.83} {1.09}  =  \\$63.29 $
						* Also, XYZ borrows `$`51.21m to partly finance the purchase
							- Geared position. Own capital:  $ \\$63.29m-\\$51.21m = \\$12.09m $
							- At year 1, pay back the debt:  $ \\$51.21m \times 1.03 = \\$52.75m $

						<p class="source" style="color: red;"><sup>(*)</sup>To replicate the calculations, don’t use 67% but 67.082%, rounding errors otherwise.</p>

					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Binomial outcome...<span class="subtitle"><br>Replicated cash flows cost `$`12.09 &mdash; This is the land’s value.</span>
						<img src="imgs/arbitrage1.png" height=400>

						* What is the required rate of return (to arrive at PV of `$`12.09)?
					</textarea>

				<section data-markdown class="compacttable">
					<textarea data-template>
						## Consistent pricing of risk? <span class="subtitle"><br>Yes!</span>
						* Required rate of return for replication portfolio is 34.42%
							- Return: $ \frac{0.7 \times \\$23.21 - \\$12.09}{ \\$12.09} = \frac{\\$4.16}{ \\$12.09} = 34.42\\%$
							- Clearly, the earlier assumption of a 20% discount rate in NPV example was too low,
							- Discount the `$`16.25 at 34.42% for an NPV of `$`12.09 (ignore rounding errors)
						* Is this in line with the market’s price of risk? Risk = range of outcomes (binomial case). Both risk <em>and</em> risk premium scale by the same factor:

						| | Built property | Development option | Ratio |
						|:---|---:|---:|---:|
						| Risk: range of outcomes | 20% &minus; (&minus;16.67%) = 36.67% | (23.21 &minus; 0) / 12.09 = 192% | 5.24&times; |
						| Risk premium: E[r] &minus; r<sub>f</sub> | 9% &minus; 3% = 6% | 34.42% &minus; 3% = 31.42% | 5.24&times; |
						| Premium per unit of risk | 6 / 36.67 = 0.164 | 31.42 / 192 = 0.164 | 1 |

						Note:

						$(0.7 \times 113.21 + 0.3 \times 78.62)/1.09 = 94.34$

					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Continuous outcomes & time <span class="subtitle"><br> Black-Scholes (1973) approach</span>
						* Price for options with more than two states: Distribution of outcomes.
						* Based on same economic arbitrage principles as for binomial models in discrete time
						* European call options (and variations)
						* Requires several strong assumptions
							- Markets are frictionless: No transaction costs. One can buy/sell any fraction of underlying asset.
							- Markets are efficient: No predictability.
							- European option that can only be exercised at expiration date.
							- No dividends are paid out during the life of the option.
							- The risk-free rate and volatility of the underlying are known and constant.
							- The returns on the underlying asset are (log)normally distributed.
					</textarea>
				</section>
				<section data-markdown >
					<textarea data-template>
						## B/S Option Pricing <span class="subtitle"><br>(For those brave enough to believe that assumptions are met...)</span>
						* Price of a European call option on a non-dividend-paying stock is given by
							- $ c = SN(d_1)-Ke^{rt}N(d_2)$,
						* where
							- $d_1 = \frac{ln(S_0/K) + (r+\sigma^2/2)T}{\sigma\sqrt{T}}$, and
							- $d_2 = d_1 - \sigma\sqrt{T}$
						* with
							- c = European call option price
							- S = current asset price
							- K = current exercise price
							- r = riskless interest rate
							- t = time to maturity
							- $\sigma$ = volatility
							- $N(d_1)$ = Prob. of a normally distributed random variable being lower or equal to $d_1$
					</textarea>
				</section>
				<section data-markdown >
					<textarea data-template>
						## Develop anytime<span class="subtitle"><br>American options more realistic for land.</span>
						* Classical Samuelson-McKean formula for American warrant
						* Again, based on same economic arbitrage principles as models in discrete time or Black-Scholes approach
						* Again, requires several strong assumptions
							- Frictionless markets / efficient markets: “Random Walk” market value of underlying asset / Normally distributed returns to underlying asset
						* Requires parameter values for
							- Built property cash yield $y_V$
							- Volatility of underlying asset $\sigma^2_V$
							- Risk-free rate $r_f$
							- Real growth rate of construction costs $g_K$
							- Value (V) of built asset, expressed relative to construction cost K
					</textarea>
				</section>
				<section data-markdown >
					<textarea data-template>
						## Samuelson-McKean formula<span class="subtitle"><br>Easy enough for calculators or Excel</span>
						* Option elasticity
							- $\eta = \frac{ y_V - y_K + 𝜎^2_V/2 + \sqrt{( y_K - y_V - 𝜎^2_V/2)^2 + 2y_k\sigma^2_V} } { 𝜎^2_V}$
							- $\eta$ gives the percentage change in value of option associated with a 1% change in the value of the underlying asset (built property)
							- “Construction yield” $y_K = r_f-g_K$, where $g_K$ is the real growth in construction costs
						* Optimal development hurdle rate $V^{*}$
							- $V^{*} = K_0\eta/(\eta-1)$
						* Option value (vacant land)
							- $C_0 = (V^{\*} - K_0)(V_0/V^{\*})\eta $
						* Spreadsheet uploaded to Moodle
						* Visualisation: <a href="http://demonstrations.wolfram.com/RealOptions/">http://demonstrations.wolfram.com/RealOptions/</a>

					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## How useful is this? <span class="subtitle"><br>Can we use option theory to trade or to benchmark investments?</span>
						* Highly efficient markets of commodity like assets like public stock and bond markets
							- Arbitrage derivation of option theory applies directly
						* Well functioning markets with frictions and some uniqueness of assets like prime commercial properties
							- Less stringent assumption: Equilibrium within and across markets assumed
							- Deviations from values based on option theory do not lead to risk-free profits, but one can still expect positive abnormal returns when buying and selling according to model
						* No functioning market, very unique assets
							- Option value theory loses basis but remains normative: “Value <em>should</em> be …”
					</textarea>
				</section>
				<section data-markdown >
					<textarea data-template>
						## Project value <span class="subtitle"><br>DCF plus option value?</span>
						 $$V_0 = \sum^{\infty}_{t=1}\frac{CF_t}{(1+r_t)^t} + OV$$

						* Volatility reduces value of DCF component but increases OV?
					</textarea>
				</section>

						## Pitfalls <span class="subtitle"><br>Not all volatility is ultimately adding option value.</span>

							- Constructions costs distribution is highly skewed: Hardly ever below initial estimate

				<section data-markdown data-background-image="imgs/economist_big.png">
					<textarea data-template>
						Notes:

						China’s leaders have cheered on the property boom for the best part of 30 years. When the central government overhauled the tax system in 1994, local authorities lost a large chunk of revenue. At the same time, local governments were prevented from issuing debt. Yet they were tasked with hitting high economic-growth targets, sometimes exceeding 10% a year. Selling land became one of the few things municipal officials could do to generate revenues, which would in turn finance roads and other public works. They could also set up companies that could borrow from banks and raise debt from other sources. This arrangement meant economic growth was tightly bound to booming property.

						Between 1999 and 2007 the quantity of rural land transferred to urban use increased by an average annual rate of almost 23%, and public-land sales soared by an average of 31% a year. Soon the property market became the prime lever for controlling economic growth. During the global financial crisis much of China’s `$`586bn stimulus package came in the form of loans and shadow-banking funds for developers. “The property market was a vehicle for delivering the stimulus,” says Kevin Lai of Daiwa Capital Markets, a broker. By 2010 land sales accounted for more than 70% of municipal incomes a year, although the rate varied between regions.
					</textarea>
				</section>

				<section data-markdown >
					<textarea data-template>
						## Then the Underlying Collapsed<span class="subtitle"><br>China’s land-sale model since the 2021 property downturn</span>
						* Land-sale revenue has fallen four years running: H1 2026 &minus;31.5% YoY (<a href="https://www.theepochtimes.com/china/chinas-land-sale-revenue-slump-deepens-despite-rise-in-fiscal-income-6066681">MoF data</a>); residential land revenue in 2025 ~65% below its 2020 peak (<a href="https://www.caixinglobal.com/2026-01-06/chinas-residential-land-sales-revenue-slumps-65-from-peak-as-state-backers-retreat-102400671.html">Caixin</a>)
						* LGFVs (local governments’ own financing vehicles) propped up land auctions after 2021, but their share of purchases fell to 15% in 2025; state-owned developers now buy about half (<a href="https://www.caixinglobal.com/2026-01-06/chinas-residential-land-sales-revenue-slumps-65-from-peak-as-state-backers-retreat-102400671.html">Caixin</a>)
						* Aug 2026 pre-sale reform: Goldman expects a further ~30% drop, up to 90% below the 2021 peak (<a href="https://www.bloomberg.com/news/articles/2026-09-07/china-property-moves-to-fuel-30-hit-to-land-sales-goldman-says">Bloomberg</a>)
						* Real-options view: municipal income was essentially the value of the option to develop land&mdash;and that option value collapses with the underlying housing market
					</textarea>
				</section>

				<section data-markdown>
					<textarea data-template>
						## Land &amp; financial markets <span class="subtitle"><br>Large land reclaimation projects spurred financial innovation.</span>

						* Tradable bonds and public exchanges &ndash; both were invented when massive projects needed to be financed in the early-modern Netherlands.

						* Oldest known bond in the world that still produces interest is the perpetual 2.5% issued in 1624 to finance the Lekdijk Bovendams, a 33 km long dyke protecting large parts of Holland and Utrecht.<img src="imgs/07-Lekdyk-groot_0.jpg" height=250>
						Notes:

						* The oldest known bond in the world that still produces interest is the perpetual 2.5% loan worth 1200 guilders, issued in 1624, of the Lekdijk Bovendams water board. The Lekdijk Bovendams, a 33 kilometer long dyke from Amerongen to Vreeswijk, protects large parts of Holland and Utrecht against the water. After a dyke burst in 1624, the water board decided to issue interest letters  (bonds) in order to finance restoration. In later years, the water board would do this more often. What has made the 1624 debenture so special is the fact that after nearly four centuries, it still pays interest. An amount of 15 euros a year, to be precise.
					</textarea>
				</section>


				<section data-markdown >
					<textarea data-template>
						## Securitised Land <span class="subtitle"><br>Holland Land Company</span>
						* In 1792-93 Dutch investors bought 13,000 square-kilometres of land in Western New York.
						* Purchase was financed by the public issuance of securities that traded on the Dutch capital market.
							- Idea was to subdivide the land and to sell it off to settlers, serve the debt, and to keep the upside.
					</textarea>
				</section>

						* No! Assumptions underlying option valuation approaches are unrealistic for properties
